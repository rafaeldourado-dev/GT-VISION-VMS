[alembic]
script_location = migrations
prepend_sys_path = .

# A linha sqlalchemy.url foi removida daqui.
# A configuração da URL da base de dados é agora gerida exclusivamente
# pelo ficheiro 'migrations/env.py' para evitar erros de parsing com
# caracteres especiais na palavra-passe.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S