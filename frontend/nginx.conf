# Arquivo: frontend/nginx.conf
# Este Nginx roda DENTRO do contêiner do frontend.
# Sua única função é servir os arquivos estáticos (HTML, CSS, JS).

server {
  listen 80;

  # Define a raiz onde os arquivos da aplicação foram copiados
  root /usr/share/nginx/html;

  # A ordem de busca para arquivos, essencial para single-page applications (SPA)
  index index.html index.htm;

  # Configuração crucial para SPAs (React, Vue, Angular)
  # Se uma URL não corresponder a um arquivo estático (ex: /dashboard, /mapa),
  # em vez de dar erro 404, ele serve o index.html principal.
  # O roteamento do React então assume o controle no navegador.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Opcional: Melhora o cache de arquivos estáticos no navegador do usuário
  location ~* \.(?:jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|css|js)$ {
    expires 1M;
    add_header Cache-Control "public";
  }
}