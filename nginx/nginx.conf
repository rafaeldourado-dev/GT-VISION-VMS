server {
    listen 80;
    server_name gtvision.site www.gtvision.site;

    # Otimização para performance e segurança
    client_max_body_size 100M; # Permite uploads de arquivos maiores (ex: imagens de câmeras)
    keepalive_timeout 65;

    # Localização raiz (/): envia tudo para a interface do frontend
    location / {
        # O nome 'frontend' é o nome do serviço no docker-compose.yml
        proxy_pass http://frontend; # O Nginx do frontend está servindo na porta 80 por padrão
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Localização da API (/api): envia para o backend
    location /api {
        # O nome 'backend' é o nome do serviço no docker-compose.yml
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Localização para o WebSocket de streaming de vídeo
    location /ws {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }
}