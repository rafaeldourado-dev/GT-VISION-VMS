services:
  db:
    image: postgres:13-alpine
    container_name: gt-vision-db
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - .env
    ports:
      - "5432:5432"
    networks:
      - gtv_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: gt-vision-rabbitmq
    # --- CORREÇÃO APLICADA AQUI ---
    # Define um hostname fixo para o container. Isso é crucial para o Erlang/RabbitMQ
    # resolver o nome do nó corretamente durante a inicialização, evitando erros de distribuição.
    hostname: gt-vision-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    env_file:
      - .env
    networks:
      - gtv_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis: # NOVO SERVIÇO DE CACHE
    image: redis:7-alpine
    container_name: gt-vision-redis
    ports:
      - "6379:6379"
    networks:
      - gtv_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: gt-vision-backend
    volumes:
      - ./backend/app:/app/app
      - ./backend/migrations:/app/migrations  # <-- ALTERAÇÃO FEITA AQUI
      - ./ai-processor/captures:/app/captures 
    ports:
      - "8000:8000"
    # NOVO: Passa as credenciais do MediaMTX para o backend
    # Certifique-se de que estas variáveis estão no seu ficheiro .env.
    # A diretiva env_file já estava presente, mas esta é a correção que garante
    # que o backend tenha acesso às credenciais do Media Server.
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis: # NOVO: Dependência do Redis
        condition: service_healthy
    networks:
      - gtv_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  ai-processor:
    build: ./ai-processor
    container_name: gt-vision-ai-processor
    volumes:
      - ./ai-processor:/app
      - ./ai-processor/captures:/app/captures
    environment:
      - OPENCV_FFMPEG_CAPTURE_OPTIONS=rtsp_transport;tcp
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - gtv_network
    restart: unless-stopped

  media-server:
    image: bluenviron/mediamtx:latest
    container_name: gt-vision-media-server
    restart: unless-stopped
    volumes:
      - ./mediamtx.yml:/mediamtx.yml
    ports:
      - "8554:8554"   # RTSP
      - "1935:1935"   # RTMP
      - "8889:8889"   # WebRTC
      - "9997:9997"   # API
    networks:
      - gtv_network
    # NOVO: Protege a API do MediaMTX com as credenciais do .env
    environment:
      - MTX_API_USER=${MEDIA_SERVER_API_USER}
      - MTX_API_PASS=${MEDIA_SERVER_API_PASS}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gt-vision-frontend
    ports:
      - "5173:80" # Expõe a porta 80 do Nginx para 5173 na sua máquina
    networks:
      - gtv_network
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  postgres_data:

networks:
  gtv_network:
    driver: bridge
