services:
  # ===============================
  # 📦 PostgreSQL Database
  # ===============================
  db:
    image: postgres:13-alpine
    container_name: gt-vision-db
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - .env
    ports:
      - "5432:5432"
    networks:
      - gtv_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===============================
  # 🐇 RabbitMQ (Mensageria)
  # ===============================
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: gt-vision-rabbitmq
    hostname: gt-vision-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672" # Painel de gerenciamento
    env_file:
      - .env
    networks:
      - gtv_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===============================
  # 🧠 Redis (Cache e Filas Rápidas)
  # ===============================
  redis:
    image: redis:7-alpine
    container_name: gt-vision-redis
    ports:
      - "6379:6379"
    networks:
      - gtv_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===============================
  # ⚙️ Backend API (FastAPI)
  # ===============================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gt-vision-backend
    volumes:
      - ./backend/app:/app/app
      - ./backend/migrations:/app/migrations
      - ./ai-processor/captures:/app/captures
      - ./logs/backend:/app/logs
    ports:
      - "8000:8000"
    # env_file: .env  # <-- DESABILITADO PARA O TESTE
    environment:
      # --- INÍCIO DA CORREÇÃO (HARDCODE) ---
      # Credenciais fixas para teste:
      - MEDIAMTX_API_USER=admin_final
      - MEDIAMTX_API_PASS=senha_final_123
      
      # --- Variáveis copiadas do .env ---
      - POSTGRES_SERVER=db
      - POSTGRES_USER=gtvision_user
      - POSTGRES_PASSWORD=UltraSecurePassword_ChangeMe_34987
      - POSTGRES_DB=gtvision_db
      - POSTGRES_PORT=5432
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
      - RABBITMQ_LPR_RESULTS_QUEUE=lpr_results_queue
      - RABBITMQ_CLIP_JOBS_QUEUE=clip_jobs_queue
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_CACHE_TTL_SECONDS=300
      - ADMIN_API_KEY=r49w4393042
      - SECRET_KEY=a7b2c9f8d1e3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - REFRESH_SECRET_KEY=seu_segredo_para_refresh_tokens_aqui_87654321
      - ENVIRONMENT=development
      - MEDIAMTX_API_URL=http://media-server:9997
      - MEDIA_SERVER_PUBLIC_HOST=127.0.0.1
      - GESTOR_MASTER_CLIENT_NAME=GT-Vision Master
      - GESTOR_DEFAULT_EMAIL=gestor@gtvision.com
      - GESTOR_DEFAULT_FULL_NAME=Gestor Master
      - GESTOR_DEFAULT_PASSWORD=GestorAdmin@2025!
      - LOG_LEVEL=info
      # --- FIM DAS VARIÁVEIS DO .ENV ---
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gtv_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ===============================
  # 🤖 AI Processor (Visão Computacional)
  # ===============================
  ai-processor:
    build:
      context: ./ai-processor
      dockerfile: Dockerfile
    container_name: gt-vision-ai-processor
    volumes:
      - ./ai-processor:/app
      - ./ai-processor/captures:/app/captures
      - ./logs/ai-processor:/app/logs
    environment:
      - OPENCV_FFMPEG_CAPTURE_OPTIONS=rtsp_transport;tcp
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - gtv_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import socket; s=socket.socket(); s.connect((\"rabbitmq\",5672)); s.close()'"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ===============================
  # 📡 Media Server (RTSP/RTMP/WebRTC)
  # ===============================
  media-server: 
    image: bluenviron/mediamtx:latest
    container_name: gt-vision-media-server
    # env_file: - .env # <-- DESABILITADO PARA O TESTE
    volumes:
      - ./mediamtx.yml:/mediamtx.yml
    ports:
      - "8554:8554"   # RTSP
      - "1935:1935"   # RTMP
      - "8889:8889"   # WebRTC
      - "9997:9997"   # API HTTP
    networks:
      - gtv_network
    restart: unless-stopped
    environment:
      # --- INÍCIO DA CORREÇÃO (HARDCODE) ---
      # Credenciais fixas para teste:
      - MTX_API_USER=admin_final
      - MTX_API_PASS=senha_final_123
      # --- FIM DA CORREÇÃO ---
    healthcheck:
      # --- INÍCIO DA CORREÇÃO (HARDCODE) ---
      # O healthcheck também precisa usar os valores fixos
      test: ["CMD-SHELL", "curl -f -u admin_final:senha_final_123 http://localhost:9997/v3/paths/list"]
      # --- FIM DA CORREÇÃO ---
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ===============================
  # 🌐 Frontend (Vite + Nginx)
  # ===============================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gt-vision-frontend
    ports:
      - "5173:80"
    networks:
      - gtv_network
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

# ===============================
# 📦 Volumes Persistentes
# ===============================
volumes:
  postgres_data:
  logs: 

# ===============================
# 🌐 Rede Compartilhada
# ===============================
networks:
  gtv_network:
    driver: bridge