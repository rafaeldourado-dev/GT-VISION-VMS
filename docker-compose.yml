services:
  # ===============================
  # 📦 PostgreSQL Database
  # ===============================
  db:
    image: postgres:13-alpine
    container_name: gt-vision-db
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - .env
    ports:
      - "5432:5432"
    networks:
      - gtv_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===============================
  # 🐇 RabbitMQ (Mensageria)
  # ===============================
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: gt-vision-rabbitmq
    hostname: gt-vision-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672" # Painel de gerenciamento
    env_file:
      - .env
    networks:
      - gtv_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===============================
  # 🧠 Redis (Cache e Filas Rápidas)
  # ===============================
  redis:
    image: redis:7-alpine
    container_name: gt-vision-redis
    ports:
      - "6379:6379"
    networks:
      - gtv_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===============================
  # ⚙️ Backend API (FastAPI)
  # ===============================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gt-vision-backend
    volumes:
      - ./backend/app:/app/app
      - ./backend/migrations:/app/migrations
      - ./ai-processor/captures:/app/captures
      - ./logs/backend:/app/logs
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - MEDIA_SERVER_API_USER=${MEDIA_SERVER_API_USER}
      - MEDIA_SERVER_API_PASS=${MEDIA_SERVER_API_PASS}
      - LOG_LEVEL=info
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gtv_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ===============================
  # 🤖 AI Processor (Visão Computacional)
  # ===============================
  ai-processor:
    build:
      context: ./ai-processor
      dockerfile: Dockerfile
    container_name: gt-vision-ai-processor
    volumes:
      - ./ai-processor:/app
      - ./ai-processor/captures:/app/captures
      - ./logs/ai-processor:/app/logs
    environment:
      - OPENCV_FFMPEG_CAPTURE_OPTIONS=rtsp_transport;tcp
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - gtv_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import socket; s=socket.socket(); s.connect((\"rabbitmq\",5672)); s.close()'"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ===============================
  # 📡 Media Server (RTSP/RTMP/WebRTC)
  # ===============================
  media-server:
    image: bluenviron/mediamtx:latest
    container_name: gt-vision-media-server
    env_file:
      - .env
    volumes:
      - ./mediamtx.yml:/mediamtx.yml
    ports:
      - "8554:8554"   # RTSP
      - "1935:1935"   # RTMP
      - "8889:8889"   # WebRTC
      - "9997:9997"   # API HTTP
    networks:
      - gtv_network
    restart: unless-stopped
    environment:
      - MTX_API_USER=${MEDIA_SERVER_API_USER}
      - MTX_API_PASS=${MEDIA_SERVER_API_PASS}
    healthcheck:
      test: ["CMD-SHELL", "curl -f -u ${MEDIA_SERVER_API_USER}:${MEDIA_SERVER_API_PASS} http://localhost:9997/v1/config/get"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ===============================
  # 🌐 Frontend (Vite + Nginx)
  # ===============================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gt-vision-frontend
    ports:
      - "5173:80"
    networks:
      - gtv_network
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

# ===============================
# 📦 Volumes Persistentes
# ===============================
volumes:
  postgres_data:
  logs:
# ===============================
# 🌐 Rede Compartilhada
# ===============================
networks:
  gtv_network:
    driver: bridge
